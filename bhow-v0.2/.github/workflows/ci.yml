name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests && mypy --strict src/bhow_core
      - name: Unit and API tests
        run: pytest -q
      - name: Database migration smoke test
        env:
          BH_APP_ENV: test
          BH_DATABASE_URL: sqlite:///./test_migration.db
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Syntax
        run: python -m compileall -q src client
